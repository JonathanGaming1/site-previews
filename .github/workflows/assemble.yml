name: assemble
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cat _import/1.part _import/2.part _import/3.part > _import/test.html
      - run: |
          git config user.name site-previews-bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git commit -m '[skip ci] assemble result'
          git push
