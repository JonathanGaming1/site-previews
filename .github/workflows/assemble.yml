name: assemble
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  assemble:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble parts
        run: |
          cat _import/1.part _import/2.part _import/3.part > _import/test.html
      - name: Commit result
        run: |
          git config user.name "site-previews-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "assemble smoke test [skip ci]"
          git push
